name: TextifyApp
options:
  bundleIdPrefix: com.textify
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false

targets:
  TextifyApp:
    type: application
    platform: iOS
    sources:
      - path: TextifyApp/Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: TextifyApp/Resources
    settings:
      base:
        INFOPLIST_FILE: TextifyApp/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.textify.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - target: TextifyKit
        embed: true
      - target: TextifyUI
        embed: true

  TextifyKit:
    type: framework
    platform: iOS
    sources:
      - path: TextifyKit
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.ios.TextifyKit

  TextifyKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TextifyKitTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: TextifyKit
      - target: TextifyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.ios.TextifyKitTests

  TextifyUI:
    type: framework
    platform: iOS
    sources:
      - path: TextifyUI
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: TextifyKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.ios.TextifyUI

  TextifyUITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TextifyUITests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: TextifyUI
      - target: TextifyKit
      - target: TextifyApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.oozoofrog.ios.TextifyUITests
